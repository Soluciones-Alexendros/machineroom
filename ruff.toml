line-length = 120
target-version = "py312"
extend-exclude = [".worktrees", ".venv", "node_modules", "tasks"]

[format]
quote-style = "double"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "N", "PL", "RUF"]
ignore = ["E402", "RUF100", "C901", "PLR0911", "PLR2004", "PLR0912", "PLR0915", "E501"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
"tools/workspace-router/status_bump.py" = ["PLC0415"]
