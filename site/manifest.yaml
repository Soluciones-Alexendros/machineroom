# Each row is one published page. A new file does not enter by its folder.
# Left out on purpose:
# - docs/USAGE.md links .env.example, docs/CONTRIBUTING.md and README.md
# - docs/STANDARD.md links agentskills.io and CHANGELOG.md
# - docs/REUTILIZACION.md links several ADRs
# - docs/architecture/overview.md links a directory and ADRs
# - docs/guides/ links ADRs and templates/product
# - CONTRIBUTING.md links CHANGELOG.md, templates and docs/STANDARD.md
# - ARCHITECTURE.md links .github/renovate.json
# - README.md is the hero source, not a page
# - runbooks, archives, plans, AGENTS.md, .env.example, skill references and scripts
