name: release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.cut.outputs.tagged }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --project tools
      - name: Validate
        run: |
          uv run --project tools python3 tools/validate/skill_spec.py
          uv run --project tools python3 tools/validate/skill_links.py
          uv run --project tools python3 tools/validate/release_coherence.py
      - name: Private denylist required before publish
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          MACHINEROOM_PRIVATE_PATTERNS: ${{ secrets.HYGIENE_DENYLIST }}
        run: uv run --project tools python3 tools/validate/private_denylist.py
      - name: Publish from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --project tools python3 tools/validate/release_coherence.py --release-gate
          uv run --project tools python3 tools/version/cut_tag.py --extract-notes "$VERSION" --notes-file notes.md
          gh release create "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
      - name: Cut annotated tag on main
        id: cut
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --project tools python3 tools/version/cut_tag.py --apply --notes-file notes.md
      - name: Push tag and create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.cut.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          gh release create "v${VERSION}" --notes-file notes.md --verify-tag

  provenance:
    name: Attest source archive
    needs: publish
    if: ${{ (github.ref == 'refs/heads/main' && needs.publish.outputs.tagged == 'true') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_VERSION}" ]; then
            VERSION="${PUBLISH_VERSION}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: cannot resolve release VERSION from publish output or tag ref (${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ] || [[ "${VERSION}" == *"/"* ]]; then
            echo "ERROR: invalid release VERSION=${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version v${VERSION}"
      - name: Archive source
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="machineroom-${VERSION}/" -o "machineroom-${VERSION}.tar.gz" HEAD
          echo "ARCHIVE=machineroom-${VERSION}.tar.gz" >> "$GITHUB_ENV"
      - name: Checksum source archive
        run: sha256sum "${ARCHIVE}" > SHA256SUMS
      - name: Verify payload completeness against this commit
        run: |
          set -euo pipefail
          EXTRACT=$(mktemp -d)
          tar -xzf "${ARCHIVE}" -C "$EXTRACT"
          PACKAGE="$EXTRACT/machineroom-${VERSION}"
          test -d "$PACKAGE"
          PYTHONPATH="$PACKAGE/tools" python3 - "$PACKAGE" <<'PY'
          import sys
          from pathlib import Path
          from harness.runtime import PAYLOAD_CURSOR, PAYLOAD_DIRS, PAYLOAD_FILES

          package = Path(sys.argv[1])
          missing = []
          for relative in (*PAYLOAD_DIRS, *PAYLOAD_CURSOR):
              if not (package / relative).is_dir():
                  missing.append(relative)
          for relative in PAYLOAD_FILES:
              if not (package / relative).is_file():
                  missing.append(relative)
          if missing:
              print("payload incomplete:", ", ".join(missing), file=sys.stderr)
              raise SystemExit(1)
          print(
              f"payload complete: {len(PAYLOAD_DIRS) + len(PAYLOAD_CURSOR)} dirs, "
              f"{len(PAYLOAD_FILES)} files"
          )
          PY
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Install cosign v3.1.4 and keyless sign-blob
        env:
          COSIGN_VERSION: "3.1.4"
          COSIGN_SHA256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
        run: |
          set -euo pipefail
          curl -fsSL -o cosign-linux-amd64 \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign-linux-amd64" | sha256sum -c -
          chmod +x cosign-linux-amd64
          mkdir -p "$HOME/.local/bin"
          mv cosign-linux-amd64 "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cosign version
          cosign sign-blob --yes --bundle "${ARCHIVE}.sigstore.json" "${ARCHIVE}"
          cosign sign-blob --yes --bundle "SHA256SUMS.sigstore.json" SHA256SUMS
          test -f "${ARCHIVE}.sigstore.json"
          test -f SHA256SUMS.sigstore.json
      - name: Generate CycloneDX SBOM with Syft v1.57.2
        env:
          SYFT_VERSION: "1.57.2"
          SYFT_SHA256: "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b"
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" syft
          mkdir -p "$HOME/.local/bin"
          mv syft "$HOME/.local/bin/syft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          EXTRACT=$(mktemp -d)
          tar -xzf "${ARCHIVE}" -C "$EXTRACT"
          PACKAGE="$EXTRACT/machineroom-${VERSION}"
          test -d "$PACKAGE"
          SBOM="machineroom-${VERSION}.cdx.json"
          syft "dir:${PACKAGE}" -o "cyclonedx-json=${SBOM}"
          test -f "$SBOM"
          echo "SBOM=${SBOM}" >> "$GITHUB_ENV"
      - name: Upload attested release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${VERSION}"
          test -n "${ARCHIVE}"
          test -f "${ARCHIVE}"
          test -f SHA256SUMS
          test -f "${ARCHIVE}.sigstore.json"
          test -f SHA256SUMS.sigstore.json
          test -f "machineroom-${VERSION}.cdx.json"
          gh release view "v${VERSION}" >/dev/null
          gh release upload "v${VERSION}" \
            "${ARCHIVE}" \
            SHA256SUMS \
            "${ARCHIVE}.sigstore.json" \
            "SHA256SUMS.sigstore.json" \
            "machineroom-${VERSION}.cdx.json"
          # Fail closed if assets are still missing after upload.
          mapfile -t ASSETS < <(gh release view "v${VERSION}" --json assets --jq '.assets[].name')
          printf '%s\n' "${ASSETS[@]}" | grep -qx "${ARCHIVE}"
          printf '%s\n' "${ASSETS[@]}" | grep -qx SHA256SUMS
          printf '%s\n' "${ASSETS[@]}" | grep -qx "${ARCHIVE}.sigstore.json"
          printf '%s\n' "${ASSETS[@]}" | grep -qx SHA256SUMS.sigstore.json
          printf '%s\n' "${ASSETS[@]}" | grep -qx "machineroom-${VERSION}.cdx.json"

  post-release-smoke:
    name: Post-release public smoke
    needs: [publish, provenance]
    if: ${{ always() && needs.provenance.result == 'success' && ((github.ref == 'refs/heads/main' && needs.publish.outputs.tagged == 'true') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Resolve version
        id: version
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_VERSION}" ]; then
            VERSION="${PUBLISH_VERSION}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: cannot resolve release VERSION from publish output or tag ref (${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ] || [[ "${VERSION}" == *"/"* ]]; then
            echo "ERROR: invalid release VERSION=${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install cosign v3.1.4 (pinned checksum)
        env:
          COSIGN_VERSION: "3.1.4"
          COSIGN_SHA256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
        run: |
          set -euo pipefail
          curl -fsSL -o cosign-linux-amd64 \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign-linux-amd64" | sha256sum -c -
          chmod +x cosign-linux-amd64
          mkdir -p "$HOME/.local/bin"
          mv cosign-linux-amd64 "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cosign version
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          ARCHIVE="machineroom-${VERSION}.tar.gz"
          SBOM="machineroom-${VERSION}.cdx.json"
          gh release download "v${VERSION}" --dir "$TMP" \
            --pattern "${ARCHIVE}" \
            --pattern SHA256SUMS \
            --pattern "${ARCHIVE}.sigstore.json" \
            --pattern "SHA256SUMS.sigstore.json" \
            --pattern "${SBOM}"
          test -f "$TMP/${ARCHIVE}"
          test -f "$TMP/SHA256SUMS"
          test -f "$TMP/${ARCHIVE}.sigstore.json"
          test -f "$TMP/SHA256SUMS.sigstore.json"
          test -f "$TMP/${SBOM}"
          (
            cd "$TMP"
            sha256sum -c SHA256SUMS
          )
          gh attestation verify "$TMP/${ARCHIVE}" --repo "${GITHUB_REPOSITORY}"
          cosign verify-blob \
            --bundle "$TMP/${ARCHIVE}.sigstore.json" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$TMP/${ARCHIVE}"
          cosign verify-blob \
            --bundle "$TMP/SHA256SUMS.sigstore.json" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$TMP/SHA256SUMS"
          mapfile -t ASSETS < <(gh release view "v${VERSION}" --json assets --jq '.assets[].name')
          printf '%s\n' "${ASSETS[@]}" | grep -qx "${SBOM}"
          echo "Public assets + checksum + attestation + cosign + SBOM OK for v${VERSION}"
      - name: Bootstrap smoke (Pi + Cursor, no models)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          # Exit 3 means not_run (missing harness binary on this runner). It is
          # reported, never promoted to pass, and never fails the release gate;
          # the artifact verification above stays strict.
          status=0
          for harness in pi cursor; do
            rc=0
            bash scripts/bootstrap.sh --version "${VERSION}" --harness "$harness" --target "$TMP/$harness" --json || rc=$?
            case "$rc" in
              0) echo "${harness}: pass" ;;
              3) echo "${harness}: not_run (harness dependency unavailable on this runner)" ;;
              *) echo "::error::bootstrap ${harness} failed with exit ${rc}"; status=1 ;;
            esac
            echo "- ${harness}: exit ${rc}" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
