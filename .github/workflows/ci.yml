name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline-python:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-python.yml
    with:
      python-version: "3.12"
      coverage-threshold: "77"
      run-build: false
      uv-project: tools

  pipeline-node:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-node.yml
    with:
      node-version: "22"
      package-manager: npm
      run-build: false
      run-test: false
      run-smoke: false
      e2e: false

  canon:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-static.yml
    with:
      quality-command: |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        archive="actionlint_1.7.12_linux_amd64.tar.gz"
        curl -fsSL -o "$tmpdir/$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tmpdir/$archive" | sha256sum -c -
        tar -xzf "$tmpdir/$archive" -C "$tmpdir" actionlint
        "$tmpdir/actionlint" -color
        bash scripts/check-structure.sh templates/product
      test-command: make -f templates/product/Makefile test
      smoke-command: MR_SMOKE_FIXTURE=1 bash scripts/smoke.sh

  # Verifica el direccionamiento que usarán los callers (ruta completa + SHA).
  caller-reusable-path:
    permissions:
      contents: read
      pull-requests: read
    uses: Soluciones-Alexendros/machineroom/.github/workflows/reusable-static.yml@676be757002f5208a1201a72e4f61e5081a540d4 # v6.0.0
    with:
      quality-command: "echo caller-path-ok"
      test-command: "echo caller-path-ok"
      smoke-command: "echo caller-path-ok"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --project tools
      - name: Hygiene
        run: uv run --project tools python3 tools/validate/hygiene.py
      - name: Announce private check not applicable on PR
        if: github.event_name == 'pull_request'
        run: echo "PRIVATE_CHECK_NOT_APPLICABLE_TO_PR"
      - name: bash -n global
        run: |
          find skills tools -name '*.sh' -print0 | xargs -0 -n1 bash -n

  g1-run-expressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --project tools
      - name: G1 — no expressions inside run scalars
        run: uv run --project tools python3 tools/validate/g1_run_expressions.py

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor v1.31.1 (pinned checksum)
        env:
          ZIZMOR_VERSION: "1.31.1"
          ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
        run: |
          set -euo pipefail
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" zizmor
          mkdir -p "$HOME/.local/bin"
          mv zizmor "$HOME/.local/bin/zizmor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: zizmor offline
        run: zizmor --offline --min-severity=medium .github/workflows

  private-denylist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --project tools
      - name: Private denylist (required on main)
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          MACHINEROOM_PRIVATE_PATTERNS: ${{ secrets.HYGIENE_DENYLIST }}
        run: uv run --project tools python3 tools/validate/private_denylist.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --project tools
      - run: uv run --project tools bash run-validation.sh

  check-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --project tools
      - name: Exigir bump de metadata.version en skills cambiadas
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: uv run --project tools python3 tools/version/bump.py --check --auto --base "origin/${BASE_REF}"
      - name: Exigir package.json por delante del tag si cambia el circuito de release
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: uv run --project tools python3 tools/version/cut_tag.py --check-repo --base "origin/${BASE_REF}"

  diagrams:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout de Archify al SHA del catálogo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tt-a1i/archify
          ref: 208acba8d412335185b2056fedf54b3405df43fb
          path: .cache/archify
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Generar diagramas
        run: make diagrams
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: diagrams
          path: docs/architecture/diagrams/rendered/
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./skills/project-status/actions/secret-scan

  license-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Syft v1.57.2 (pinned checksum)
        env:
          SYFT_VERSION: "1.57.2"
          SYFT_SHA256: "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b"
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" syft
          mkdir -p "$HOME/.local/bin"
          mv syft "$HOME/.local/bin/syft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          syft version
      - name: Archive HEAD, SBOM, license gate
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="machineroom-SNAPSHOT/" \
            -o machineroom-SNAPSHOT.tar.gz HEAD
          EXTRACT=$(mktemp -d)
          tar -xzf machineroom-SNAPSHOT.tar.gz -C "$EXTRACT"
          PACKAGE="$EXTRACT/machineroom-SNAPSHOT"
          test -d "$PACKAGE"
          SBOM=machineroom-SNAPSHOT.cdx.json
          syft "dir:${PACKAGE}" -o "cyclonedx-json=${SBOM}"
          test -f "$SBOM"
          python3 tools/validate/license_gate.py \
            --sbom "$SBOM" \
            --allowlist tools/validate/license_allowlist.txt

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: python,actions
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep 1.186.0 (pinned wheel SHA-256)
        env:
          SEMGREP_VERSION: "1.186.0"
          SEMGREP_SHA256: "54ebaf79adf4e5855c54d5e4457d8d03f27cc6bf73d79642281790b833d92e4f"
          SEMGREP_WHEEL: "semgrep-1.186.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl"
          SEMGREP_WHEEL_URL: "https://files.pythonhosted.org/packages/fd/8c/25b9b38199d0bb5ec2fb12dbea2a7172b6cd0672a1161e2e33dbf3029cd1/semgrep-1.186.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          curl -fsSL -o "$tmpdir/$SEMGREP_WHEEL" "$SEMGREP_WHEEL_URL"
          echo "${SEMGREP_SHA256}  $tmpdir/$SEMGREP_WHEEL" | sha256sum -c -
          python3 -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/pip" install --no-cache-dir "$tmpdir/$SEMGREP_WHEEL"
          echo "$tmpdir/venv/bin" >> "$GITHUB_PATH"
      - name: Semgrep (ERROR fails; WARNING does not)
        run: |
          set -euo pipefail
          # p/bash is 404 on semgrep.dev; Bash is covered by the shellcheck job.
          semgrep --metrics=off --error --severity ERROR \
            --config p/python --config r/bash \
            scripts/ tools/ skills/

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck v0.11.0 (pinned checksum)
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive"
          mkdir -p "$HOME/.local/bin"
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: shellcheck scripts skills tools
        run: |
          set -euo pipefail
          # Severity warning+: info/style stay advisory; matches Semgrep ERROR gate spirit.
          find scripts skills tools -name '*.sh' -print0 | xargs -0 shellcheck -S warning

  distro-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-native
            runs-on: ubuntu-latest
          - name: debian-12-slim
            runs-on: ubuntu-latest
            # debian 12-slim linux/amd64 (hub digest 2026-11)
            container: debian@sha256:c67e92c8099ba22853ab4cfda7cfb494d253d6012ca82dee98ba8976772af018
          - name: archlinux
            runs-on: ubuntu-latest
            # archlinux:latest linux/amd64 (hub digest 2026-11)
            container: archlinux@sha256:fcee73ea1b96e236248f53a213f71276cc9072d9025b58bce9915e32f19963ae
    name: distro-smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Ensure bash curl git python3
        shell: sh
        run: |
          set -eu
          need_bash=0
          need_curl=0
          need_git=0
          need_python=0
          command -v bash >/dev/null 2>&1 || need_bash=1
          command -v curl >/dev/null 2>&1 || need_curl=1
          command -v git >/dev/null 2>&1 || need_git=1
          command -v python3 >/dev/null 2>&1 || need_python=1
          if [ "$need_bash$need_curl$need_git$need_python" != "0000" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                bash curl git ca-certificates python3
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Sy --noconfirm --needed archlinux-keyring
              pacman -Sy --noconfirm --needed bash curl git python
            else
              echo "missing package manager (need apt-get or pacman)"
              exit 1
            fi
          fi
          if ! command -v bash >/dev/null 2>&1; then
            echo "missing package: bash"
            exit 1
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "missing package: curl"
            exit 1
          fi
          if ! command -v git >/dev/null 2>&1; then
            echo "missing package: git"
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "missing package: python3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n installer scripts
        shell: bash
        run: |
          set -euo pipefail
          find scripts -maxdepth 1 -name 'install*.sh' -print0 | xargs -0 -n1 bash -n
      - name: install.sh dry-run (cursor opencode pi)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          for harness in cursor opencode pi; do
            bash scripts/install.sh --dry-run --harness "$harness" --target "$tmp/$harness"
          done

  ci-gate:
    name: ci-gate
    needs:
      [
        pipeline-python,
        pipeline-node,
        canon,
        caller-reusable-path,
        hygiene,
        g1-run-expressions,
        zizmor,
        private-denylist,
        validate,
        check-bump,
        diagrams,
        secret-scan,
        license-gate,
        codeql,
        semgrep,
        shellcheck,
        distro-smoke,
      ]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluar needs y hold
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # PR: private-denylist skipped by contract. Push main: check-bump skipped.
          ALLOWED_SKIPS: ${{ github.event_name == 'pull_request' && 'private-denylist' || 'check-bump' }}
          HOLD: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'hold') }}
        run: python3 tools/validate/ci_gate.py
